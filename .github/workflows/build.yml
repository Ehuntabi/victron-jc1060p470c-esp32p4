name: build

on:
  push:
  pull_request:

# Estos jobs solo leen el repo; el token por defecto puede escribir.
# Las acciones van FIJADAS POR SHA, no por etiqueta (auditoria de seguridad del
# 13-oct-2026): una etiqueta la puede mover quien controle el repo de la accion
# -- o quien se haga con el -- y el runner ejecutaria ese codigo con el token
# del reposo (contents: read). Con el SHA, lo que corre es exactamente lo que se
# reviso. Para actualizar: mira el SHA de la etiqueta nueva y cambialo aqui.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # sin los tags, la version embebida sale "v?"

      # El IDF v5.5.5 es ANTERIOR al arreglo oficial del memcpy con NULL
      # (entra en 5.5.6). release.sh ya lo parchea en local, pero el CI compilaba
      # con el IDF pristino: o sea, un firmware distinto del que se publica.
      # Aqui se aplica el MISMO parche (el script es el mismo que usa el build
      # local) antes de compilar, y si no aplica el CI se pone en rojo en vez de
      # publicar algo distinto. Auditoria del 23-sep-2026, punto pendiente.
      - name: esp-idf build (con los parches de patches/ aplicados)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: '.'
          command: |
            bash scripts/aplicar_parche_idf.sh && idf.py build

      # Tests que no necesitan hardware y verificador de reglas (auditoria 21-sep-2026).
      # El verificador va DESPUES del build a proposito: comprueba las opciones
      # criticas dentro del sdkconfig.h que se acaba de generar, que es donde se
      # descubrio que la IPA nunca estuvo encendida.
      #
      # El cJSON del IDF se baja AQUI (clon disperso, solo esa carpeta) porque el
      # test estrella de la propiedad del viaje lo necesita para compilar el codigo
      # real de config_server_viaje.c: sin el imprimia "SKIP" y salia 0, asi que el
      # step se veia verde sin probar nada (auditoria del 16-oct-2026, run
      # 38949498337). Ahora test_viaje_dueno.sh FALLA si en CI no encuentra el
      # cJSON, y aqui se le da.
      - name: Bajar el cJSON del IDF (para el test de propiedad del viaje)
        run: |
          # cJSON NO es una carpeta del IDF: es un SUBMODULO suyo
          # (components/json/cJSON -> DaveGamble/cJSON). Un clon disperso del IDF
          # deja ahi el enlace del submodulo, no el codigo, y `git sparse-checkout
          # set` aborta con "is not a directory" (exit 128, visto en el run
          # 38957404979). Se clona su repositorio a la version que el IDF 5.5.5
          # fija (1.7.19, ver .gitmodules del IDF) directamente donde el test lo
          # busca.
          mkdir -p /tmp/idf/components/json
          git clone --depth 1 --branch v1.7.19 \
            https://github.com/DaveGamble/cJSON.git /tmp/idf/components/json/cJSON
          ls /tmp/idf/components/json/cJSON/cJSON.c

      - name: Test del protocolo mini_proto y de la propiedad del viaje
        run: IDF_PATH=/tmp/idf bash test/run.sh
      - name: Verificador de reglas (opciones criticas, pilas, cadenas, clave)
        run: bash test/auditar.sh

      # ── LOS GUARDAS DE LOS SCRIPTS DE PUBLICAR Y GRABAR (16-oct-2026) ─────
      # El CI no graba ni publica (no hay placa ni secretos): el .bin de la
      # Release lo compila release.sh en local. Lo que si puede hacer es vigilar
      # que esos scripts conserven sus comprobaciones: la auditoria del 16-oct
      # encontro el "idf.py flash" a mano en la salida de release.sh y el asset de
      # la Release comprobado solo "existe y tiene algun .bin". Que se caiga aqui
      # es barato; que se caiga con la placa delante, no.
      - name: Los guardas de grabar.sh y release.sh siguen en su sitio
        run: |
          fallo=0
          g=scripts/grabar.sh; r=release.sh
          for f in "$g" "$r" scripts/bin_con_version.sh; do
            [ -f "$f" ] || { echo "FALTA $f"; fallo=1; }
          done
          for frase in 'git describe --tags --exact-match' 'git ls-remote origin'                        'gh release download' 'sha256sum' 'chip_id' 'write_flash'                        'components' 'partitions.csv' 'spiffs.bin'                        'git checkout -- sdkconfig'; do
            grep -qF -- "$frase" "$g" || { echo "$g: le falta '$frase'"; fallo=1; }
          done
          for frase in 'sha256sum' 'gh release upload' 'grep -qxF "$a"' \
                       'la Release $TAG ya existe' 'git checkout -- sdkconfig'; do
            grep -qF -- "$frase" "$r" || { echo "$r: le falta '$frase'"; fallo=1; }
          done
          # release.sh no puede volver a mandar a `idf.py flash` (el camino sin
          # comprobaciones y que recompila antes de grabar)
          if grep -qE '^[[:space:]]*idf\.py +-p.*flash' "$r"; then
            echo "$r: ha vuelto 'idf.py -p ... flash' a la salida del script"; fallo=1
          fi
          # bin_con_version.sh no puede borrar de ~/joint-releases una version mas
          # nueva que la del build (paso el 16-oct con un checkout de un tag viejo)
          grep -q 'version_mayor' scripts/bin_con_version.sh \
            || { echo "scripts/bin_con_version.sh: le falta el guard de version mayor"; fallo=1; }
          [ "$fallo" = 0 ] || { echo "Se han perdido guardas en los scripts de publicar/grabar"; exit 1; }
          echo "guardas presentes"

      - name: shellcheck de los scripts propios
        run: |
          shellcheck -S warning scripts/grabar.sh scripts/bin_con_version.sh release.sh \
            test/auditar.sh test/run.sh test/test_viaje_dueno.sh test/test_viaje_token.sh


  # El contrato con la app del movil, comprobado SIN placa: se compilan
  # main/portal/contrato_app.c y test/test_contrato_app.c con el gcc de la maquina
  # y se ejecutan sus pruebas (es codigo de produccion: los handlers de /ausente y
  # /api/viaje llaman a esas funciones), mas un repaso de endpoints, puertos y
  # campos. Existe porque el borrado de viajes estuvo roto desde la v3.29 y no se
  # supo hasta probarlo con el movil (28-sep-2026): compilar los dos lados no
  # prueba el contrato entre ellos.
  contrato_app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Contrato con la app (endpoints, puertos y campos)
        run: bash test/contrato_app.sh

  # mini_proto.h se mantiene sincronizado A MANO entre este repo y 35cabina
  # (protocolo UDP compartido, ver la cabecera del fichero). Sin esto, editar
  # solo una copia no falla hasta que los dos aparatos se rechazan los
  # paquetes en produccion, semanas despues. Detectado auditando el
  # 07-sep-2026.
  mini_proto_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: victron

      - name: Checkout 35cabina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/35cabina
          path: 35cabina

      # La 5" habla el mismo protocolo y hasta el 13-oct-2026 no la miraba
      # ningun job de contrato.
      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/cabina5
          path: cabina5

      - name: Comparar mini_proto.h entre los dos proyectos
        run: |
          diff victron/main/net/mini_proto.h 35cabina/main/net/mini_proto.h
          diff victron/main/net/mini_proto.h cabina5/main/net/mini_proto.h

  # El limite de cuerpo del apunte tambien se mantiene sincronizado A MANO
  # (CUERPO_MAX en el satelite tiene que caber siempre en VIAJE_BODY_MAX de
  # la P4, con margen): si CUERPO_MAX llegara a igualar o superar el buffer
  # de la P4, esta empezaria a rechazar apuntes validos con 413 en silencio
  # hasta que alguien lo notara en produccion. Detectado auditando el
  # 08-sep-2026 (mismo motivo que mini_proto_sync).
  viaje_body_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: victron

      - name: Checkout 35cabina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/35cabina
          path: 35cabina

      # La 5" habla el mismo protocolo y hasta el 13-oct-2026 no la miraba
      # ningun job de contrato.
      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/cabina5
          path: cabina5

      - name: Comprobar que CUERPO_MAX (satelite) cabe en VIAJE_BODY_MAX (P4)
        run: |
          cuerpo_max=$(grep -oP '#define\s+CUERPO_MAX\s+\K[0-9]+' 35cabina/main/net/viaje_cola.h)
          cuerpo_max5=$(grep -oP '#define\s+CUERPO_MAX\s+\K[0-9]+' cabina5/main/net/viaje_cola.h)
          if [ "$cuerpo_max" != "$cuerpo_max5" ]; then
            echo "CUERPO_MAX distinto entre las dos cabinas ($cuerpo_max vs $cuerpo_max5)"
            exit 1
          fi
          body_max=$(grep -oP '#define\s+VIAJE_BODY_MAX\s+\K[0-9]+' victron/main/portal/config_server_viaje.c)
          echo "CUERPO_MAX (35cabina) = $cuerpo_max"
          echo "VIAJE_BODY_MAX (victron) = $body_max"
          if [ -z "$cuerpo_max" ] || [ -z "$body_max" ]; then
            echo "No se pudo leer alguna de las dos constantes"; exit 1
          fi
          if [ "$cuerpo_max" -ge "$body_max" ]; then
            echo "CUERPO_MAX ($cuerpo_max) ya no cabe con margen en VIAJE_BODY_MAX ($body_max) -- subir VIAJE_BODY_MAX en victron"
            exit 1
          fi

  # El contrato entre las DOS placas: la cabina manda JSON por HTTP y mensajes
  # binarios por UDP, y nada de eso salta al compilar, porque son dos repos.
  # El 30-sep-2026 se quedo un viaje sin enviar por esto. Ver test/protocolo_cabina.sh.
  protocolo_cabina:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: victron

      - name: Checkout 35cabina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/35cabina
          path: 35cabina

      # La 5" habla el mismo protocolo y hasta el 13-oct-2026 no la miraba
      # ningun job de contrato.
      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/cabina5
          path: cabina5

      - name: Comprobar que la cabina y la P4 hablan el mismo idioma
        # Se llama DOS veces, una por cabina: el script compara victron contra
        # UNA cabina, y asi no hay que reescribirlo (auditoria del 13-oct-2026:
        # la 5" no estaba en ningun job de contrato).
        run: |
          bash victron/test/protocolo_cabina.sh victron 35cabina
          bash victron/test/protocolo_cabina.sh victron cabina5
