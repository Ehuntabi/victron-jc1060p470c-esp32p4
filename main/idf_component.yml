## IDF Component Manager Manifest
dependencies:
  idf:
    version: '>=5.3.0'
  lvgl/lvgl: '>=8.4.0,<9.0.0'
  espressif/esp_lvgl_port:
    # <2.9.0: la 2.9.0 broto sola al re-resolver dependencias (component
    # manager coge la mas nueva que cumpla el rango); sin probarla en placa
    # real no se sube sin querer en un release de otra cosa. 2026-08-08.
    version: '>=2.3.0,<2.9.0'
  # esp_lcd_jd9165 forkeado a components/esp_lcd_jd9165/ con el read_id
  # del init parcheado (cuelga el host esperando respuesta del panel ->
  # WDT 5 s). No dependemos del componente managed para no traerlo de
  # vuelta a managed_components/. Ver components/esp_lcd_jd9165/.
  espressif/esp_lcd_touch_gt911:
    version: ^1
  espressif/esp_lcd_touch:
    version: ^1.1.2
  # Salto de esp_hosted 0.0.27 -> 2.12.13 el 23-sep-2026 (tanda de la radio).
  # Motivo y trampas en documentacion/C6_FIRMWARE_ACTUALIZACION.md: el AP salia
  # abierto y con otro nombre. A partir de la 2.11.0 el host EXIGE
  # esp_wifi_remote >= 1.3.1 (aqui resuelve 1.6.5), y desde la 2.5.2 el
  # controlador BT del C6 arranca APAGADO: lo enciende victron_ble.c.
  # OJO: host y esclavo van EMPAREJADOS. Con un C6 viejo, el host nuevo levanta
  # el AP pero el BLE no arranca (medido el 23-sep-2026). Por eso, para
  # actualizar una placa que aun tenga el C6 viejo hay que grabar el C6 ANTES:
  # ver tools/c6_updater/LEEME.md.
  espressif/esp_wifi_remote:
    version: '>=1.3.1,<2.0.0'
  espressif/esp_hosted:
    version: '==2.12.13'
  espressif/onewire_bus: '>=0.1.0'
  espressif/ds18b20: '>=0.1.0'
  espressif/esp_codec_dev: ^1.3.0
  # Camara MIPI-CSI OV02C10 (auto-brillo + vigilancia). esp_video arrastra
  # esp_cam_sensor + esp_ipa.
  # SUBIDO a 2.5.0 el 21-sep-2026, junto con el salto a IDF 5.5.5: a partir de la
  # 2.3.0 el componente necesita IDF>=5.5 (llama a esp_isp_new_processor con
  # salida RAW, que el ISP del 5.4.4 rechaza). Trae esp_cam_sensor 2.6, esp_ipa
  # 2.4 y, con el, los modelos de AWB nuevos (entre ellos el de temperatura de
  # color FIJA), que es lo que hace falta para el color en penumbra.
  espressif/esp_video: '==2.5.0'
